<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Premium | Hardware News Pro</title>

<style>
:root{
  --bg:#07111f;
  --bg2:#0b1626;
  --card:#101d30;
  --blue:#00b7ff;
  --blue2:#63d5ff;
  --text:#f5f8fc;
  --muted:#a5b3c5;
  --border:#20334c;
  --green:#25D366;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top left,rgba(0,183,255,.14),transparent 30%),
    linear-gradient(145deg,var(--bg),var(--bg2));
}

a{
  text-decoration:none;
  color:inherit;
}

button{
  font-family:inherit;
}

.container{
  width:min(1150px,92%);
  margin:auto;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(7,17,31,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}

nav{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:20px;
  font-weight:900;
}

.logo span{
  color:var(--blue);
}

.nav-links{
  display:flex;
  gap:20px;
}

.nav-links a{
  color:var(--muted);
  font-size:14px;
}

.nav-links a:hover{
  color:var(--blue);
}

.nav-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.user-name{
  color:var(--blue2);
  font-size:13px;
  font-weight:bold;
}

/* BUTTONS */

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:13px 19px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:800;
  background:linear-gradient(135deg,var(--blue2),var(--blue));
  color:#03111c;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-outline{
  background:transparent;
  color:white;
  border:1px solid var(--border);
}

.btn-green{
  background:var(--green);
  color:white;
}

/* HERO */

.hero{
  padding:80px 0 60px;
  text-align:center;
}

.badge{
  display:inline-block;
  padding:8px 14px;
  border-radius:30px;
  background:rgba(0,183,255,.09);
  border:1px solid rgba(0,183,255,.25);
  color:var(--blue2);
  font-size:11px;
  font-weight:900;
}

.hero h1{
  font-size:clamp(42px,7vw,72px);
  margin:20px 0;
  line-height:1;
}

.hero h1 span{
  color:var(--blue);
}

.hero p{
  max-width:650px;
  margin:auto;
  color:var(--muted);
  line-height:1.7;
}

.hero-buttons{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
  margin-top:28px;
}

/* STATUS */

.status-box{
  max-width:850px;
  margin:10px auto 50px;
  padding:25px;
  text-align:center;
  border-radius:20px;
  background:var(--card);
  border:1px solid var(--border);
}

.status-icon{
  font-size:38px;
  margin-bottom:10px;
}

.status-box h2{
  margin:10px 0;
}

.status-box p{
  color:var(--muted);
}

/* CONTENT */

section{
  padding:55px 0;
}

.section-title{
  margin-bottom:30px;
}

.section-title h2{
  font-size:35px;
  margin:12px 0;
}

.section-title p{
  color:var(--muted);
}

.premium-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.premium-card{
  position:relative;
  min-height:300px;
  padding:25px;
  overflow:hidden;
  border-radius:20px;
  background:var(--card);
  border:1px solid var(--border);
}

.premium-card h3{
  font-size:23px;
}

.premium-card p{
  color:var(--muted);
  line-height:1.6;
}

.card-icon{
  font-size:45px;
}

.locked .real-content{
  filter:blur(4px);
  opacity:.35
