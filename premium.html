<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Área Premium | Hardware News Pro</title>

<style>
:root{
  --bg:#07111f;
  --bg2:#0b1626;
  --card:#101d30;
  --card2:#091421;
  --blue:#00b7ff;
  --blue2:#63d5ff;
  --text:#f5f8fc;
  --muted:#a5b3c5;
  --border:#20334c;
  --green:#2ee59d;
  --yellow:#ffbd45;
  --danger:#ff5c70;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top right,rgba(0,183,255,.14),transparent 28%),
    linear-gradient(145deg,var(--bg),var(--bg2));
  color:var(--text);
}

a{
  text-decoration:none;
  color:inherit;
}

button{
  font-family:inherit;
}

.container{
  width:min(1200px,92%);
  margin:auto;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(7,17,31,.96);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
}

nav{
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:20px;
  font-weight:900;
}

.logo span{
  color:var(--blue);
}

.nav-links{
  display:flex;
  gap:22px;
}

.nav-links a{
  color:var(--muted);
  font-size:14px;
}

.nav-links a:hover,
.nav-links a.active{
  color:var(--blue);
}

.nav-actions{
  display:flex;
  gap:10px;
  align-items:center;
}

/* BUTTONS */

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:13px 18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:800;
  transition:.2s;
  background:linear-gradient(135deg,var(--blue2),var(--blue));
  color:#03111c;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-outline{
  background:transparent;
  color:white;
  border:1px solid var(--border);
}

.btn-contact{
  background:#25D366;
  color:white;
}

.btn-danger{
  background:rgba(255,92,112,.1);
  color:#ff9daa;
  border:1px solid rgba(255,92,112,.25);
}

/* BADGES */

.badge{
  display:inline-block;
  padding:8px 13px;
  border-radius:30px;
  border:1px solid rgba(0,183,255,.3);
  background:rgba(0,183,255,.08);
  color:var(--blue2);
  font-size:11px;
  font-weight:900;
  letter-spacing:.4px;
}

.badge-premium{
  background:rgba(255,189,69,.1);
  border-color:rgba(255,189,69,.35);
  color:var(--yellow);
}

/* HERO */

.dashboard{
  padding:55px 0 30px;
}

.dashboard-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:25px;
}

.dashboard h1{
  font-size:clamp(35px,5vw,58px);
  margin:15px 0 10px;
  letter-spacing:-2px;
}

.dashboard h1 span{
  color:var(--blue);
}

.dashboard p{
  color:var(--muted);
  line-height:1.6;
}

/* USER CARD */

.user-card{
  margin-top:30px;
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:20px;
  padding:25px;
  border-radius:22px;
  background:rgba(16,29,48,.9);
  border:1px solid rgba(0,183,255,.18);
}

.avatar{
  width:65px;
  height:65px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  font-weight:900;
  color:#02111d;
  background:linear-gradient(135deg,var(--blue2),var(--blue));
}

.user-info h2{
  margin:0 0 6px;
}

.user-info p{
  margin:0;
}

.user-status{
  text-align:right;
}

.status{
  display:inline-flex;
  padding:8px 13px;
  border-radius:30px;
  font-size:12px;
  font-weight:900;
}

.status.free{
  color:var(--blue2);
  background:rgba(0,183,255,.1);
  border:1px solid rgba(0,183,255,.25);
}

.status.premium{
  color:var(--yellow);
  background:rgba(255,189,69,.1);
  border:1px solid rgba(255,189,69,.3);
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-top:20px;
}

.stat{
  padding:22px;
  border-radius:18px;
  background:var(--card);
  border:1px solid var(--border);
}

.stat small{
  color:var(--muted);
}

.stat strong{
  display:block;
  margin-top:9px;
  font-size:20px;
}

/* SECTIONS */

section{
  padding:40px 0;
}

.section-header{
  margin-bottom:25px;
}

.section-header h2{
  margin:12px 0 8px;
  font-size:34px;
}

.section-header p{
  margin:0;
  color:var(--muted);
}

/* CONTENT GRID */

.content-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.content-card{
  position:relative;
  min-height:280px;
  overflow:hidden;
  padding:25px;
  border-radius:20px;
  background:var(--card);
  border:1px solid var(--border);
}

.content-icon{
  font-size:50px;
}

.content-card h3{
  font-size:22px;
  margin:20px 0 10px;
}

.content-card p{
  color:var(--muted);
  line-height:1.6;
}

.content-card.locked .content-data{
  filter:blur(3px);
  opacity:.38;
}

.lock-overlay{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
  background:linear-gradient(
    transparent,
    rgba(4,10,18,.97) 60%
  );
}

.lock-overlay h3{
  margin:10px 0 8px;
}

.lock-icon{
  font-size:42px;
}

/* PREMIUM CONTENT */

.premium-content{
  display:none;
}

.premium-content.visible{
  display:block;
}

/* BENCHMARKS */

.benchmark-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.benchmark-card{
  padding:25px;
  border-radius:20px;
  background:var(--card);
  border:1px solid var(--border);
}

.benchmark-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.benchmark-card h3{
  margin:20px 0;
}

.bar-group{
  margin:14px 0;
}

.bar-label{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-bottom:7px;
  color:var(--muted);
}

.bar{
  height:10px;
  border-radius:20px;
  background:#06101c;
  overflow:hidden;
}

.bar span{
  display:block;
  height:100%;
  border-radius:20px;
  background:linear-gradient(90deg,var(--blue),var(--blue2));
}

/* UPGRADE */

.upgrade{
  padding:40px;
  border-radius:25px;
  text-align:center;
  background:
    radial-gradient(circle at top center,rgba(0,183,255,.16),transparent 50%),
    linear-gradient(135deg,#0a2235,#141735);
  border:1px solid rgba(0,183,255,.25);
}

.upgrade h2{
  font-size:38px;
  margin:15px 0;
}

.upgrade p{
  max-width:600px;
  margin:0 auto 25px;
  color:var(--muted);
}

/* PLANS */

.plans{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-top:25px;
}

.plan{
  padding:25px;
  border-radius:20px;
  text-align:left;
  background:rgba(7,17,31,.6);
  border:1px solid var(--border);
}

.plan.popular{
  border-color:var(--blue);
}

.plan h3{
  margin:0;
}

.price{
  margin:18px 0;
  font-size:30px;
  font-weight:900;
}

.price span{
  font-size:13px;
  font-weight:normal;
  color:var(--muted);
}

.plan ul{
  padding:0;
  list-style:none;
}

.plan li{
  color:var(--muted);
  margin:10px 0;
}

/* EMPTY LOGIN */

.login-required{
  padding:50px 25px;
  text-align:center;
  border-radius:25px;
  background:var(--card);
  border:1px solid var(--border);
}

.login-required h2{
  font-size:34px;
}

/* FOOTER */

footer{
  margin-top:30px;
  padding:40px 0;
  text-align:center;
  border-top:1px solid var(--border);
  color:var(--muted);
}

footer strong{
  color:white;
}

footer strong span{
  color:var(--blue);
}

/* WHATSAPP */

.whatsapp-float{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:500;
  width:58px;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#25D366;
  color:white;
  font-size:28px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}

/* MOBILE */

@media(max-width:900px){

  .content-grid{
    grid-template-columns:1fr 1fr;
  }

  .plans{
    grid-template-columns:1fr;
  }

}

@media(max-width:700px){

  .nav-links{
    display:none;
  }

  .dashboard-top{
    display:block;
  }

  .user-card{
    grid-template-columns:auto 1fr;
  }

  .user-status{
    grid-column:1/-1;
    text-align:left;
  }

  .stats,
  .content-grid,
  .benchmark-grid{
    grid-template-columns:1fr;
  }

  .nav-actions .btn-outline{
    display:none;
  }

  .upgrade{
    padding:30px 20px;
  }

}

</style>
</head>
