<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b14">
<title>Hardware News Pro</title>

<style>
:root{
  --bg:#070b14;
  --card:#101a2b;
  --blue:#00b7ff;
  --blue2:#63d5ff;
  --text:#f4f8ff;
  --muted:#93a4ba;
  --border:rgba(255,255,255,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 10% 0%,rgba(0,183,255,.14),transparent 28%),
    var(--bg);
  color:var(--text);
}
a{text-decoration:none;color:inherit}
.container{width:min(1150px,92%);margin:auto}
.hidden{display:none!important}

/* HEADER */
header{
  position:sticky;top:0;z-index:100;
  background:rgba(7,11,20,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
}
nav{
  height:70px;display:flex;align-items:center;
  justify-content:space-between;gap:20px
}
.logo{font-size:20px;font-weight:900}
.logo span{color:var(--blue)}
.links{display:flex;gap:24px}
.links a{color:var(--muted);font-size:14px}
.links a:hover{color:var(--blue)}
.actions{display:flex;gap:10px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:45px;padding:0 20px;border-radius:10px;
  background:linear-gradient(135deg,var(--blue2),var(--blue));
  color:#04131e;font-weight:bold;border:0;
}
.btn.outline{
  color:var(--text);background:transparent;border:1px solid var(--border)
}
.menu{
  display:none;background:var(--card);color:white;
  border:1px solid var(--border);width:44px;height:44px;
  border-radius:10px;font-size:22px
}

/* HERO */
.hero{padding:80px 0 60px}
.hero-grid{
  display:grid;grid-template-columns:1.25fr .75fr;
  gap:35px;align-items:center
}
.badge,.tag{
  display:inline-block;padding:8px 13px;border-radius:50px;
  color:var(--blue2);background:rgba(0,183,255,.08);
  border:1px solid rgba(0,183,255,.25);
  font-size:11px;font-weight:bold;letter-spacing:.5px
}
h1{
  font-size:clamp(48px,7vw,78px);line-height:.95;
  letter-spacing:-3px;margin:20px 0
}
h1 span{color:var(--blue)}
.hero p{color:var(--muted);line-height:1.7;font-size:17px}
.hero-buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}

.premium-box{
  padding:32px;border-radius:25px;min-height:340px;
  background:linear-gradient(145deg,#142540,#09111e);
  border:1px solid rgba(0,183,255,.2)
}
.premium-box .icon{font-size:55px}
.premium-box h2{font-size:30px;margin:15px 0 10px}
.premium-box p{margin-bottom:22px}

/* SECTIONS */
section{padding:55px 0}
.section-title{
  display:flex;justify-content:space-between;
  align-items:end;margin-bottom:25px;gap:20px
}
.section-title h2{font-size:34px;margin-top:10px}
.section-title p{color:var(--muted)}
.categories{
  display:flex;gap:10px;overflow:auto;padding-bottom:8px
}
.category{
  white-space:nowrap;padding:11px 16px;border-radius:50px;
  background:var(--card);color:white;border:1px solid var(--border)
}
.category.active,.category:hover{
  border-color:var(--blue);color:var(--blue2);
  background:rgba(0,183,255,.08)
}

/* NEWS */
.featured{
  display:grid;grid-template-columns:1.35fr .65fr;gap:18px
}
.main-news{
  min-height:420px;display:flex;align-items:end;border-radius:20px;
  overflow:hidden;border:1px solid var(--border);
  background:
    linear-gradient(0deg,rgba(3,7,14,.98),rgba(3,7,14,.12)),
    linear-gradient(135deg,#006b9f,#18214b 60%,#38176d)
}
.main-content{padding:35px;width:100%}
.main-content h3{font-size:40px;margin:12px 0}
.main-content p{color:#c1ccda;line-height:1.6;margin-bottom:20px}

.side{display:flex;flex-direction:column;gap:18px}
.side-card{
  flex:1;padding:24px;border-radius:20px;
  background:var(--card);border:1px solid var(--border)
}
.side-card h3{margin:12px 0;font-size:20px}
.side-card p{color:var(--muted);line-height:1.6;font-size:14px}
.side-card a{display:inline-block;margin-top:15px;color:var(--blue2)}

.grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:18px;margin-top:18px
}
.news-card{
  overflow:hidden;background:var(--card);
  border:1px solid var(--border);border-radius:20px;
  transition:.2s
}
.news-card:hover{transform:translateY(-4px);border-color:var(--blue)}
.news-image{
  height:160px;display:flex;align-items:center;
  justify-content:center;font-size:60px;
  background:linear-gradient(135deg,#006b9f,#18214b)
}
.news-card:nth-child(2) .news-image{
  background:linear-gradient(135deg,#793314,#5d1818)
}
.news-card:nth-child(3) .news-image{
  background:linear-gradient(135deg,#4b217d,#202c68)
}
.news-content{padding:20px}
.news-content h3{font-size:20px;margin:10px 0}
.news-content p{color:var(--muted);line-height:1.6;font-size:14px}
.read{
  width:100%;margin-top:16px;padding:11px;
  background:#17243a;color:white;border:1px solid var(--border);
  border-radius:10px
}

/* PREMIUM */
.premium-section{
  background:linear-gradient(135deg,#121027,#07121e)
}
.premium-wrap{
  padding:35px;border:1px solid rgba(117,92,255,.25);
  border-radius:25px
}
.premium-head{
  display:flex;justify-content:space-between;gap:20px;margin-bottom:25px
}
.premium-head h2{font-size:38px;margin:15
