<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#070b14">

<title>Hardware News Pro | Notícias de Hardware</title>

<style>

:root{
    --bg:#070b14;
    --bg2:#0b1220;
    --card:#101827;
    --card-hover:#162238;
    --text:#f1f5f9;
    --muted:#94a3b8;
    --blue:#38bdf8;
    --blue-dark:#0284c7;
    --purple:#8b5cf6;
    --green:#22c55e;
    --red:#ef4444;
    --line:#243044;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:
    radial-gradient(
        circle at top,
        #111d36 0%,
        var(--bg) 45%
    );
    color:var(--text);
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(7,11,20,.95);
    backdrop-filter:blur(15px);
    border-bottom:1px solid var(--line);
}
