<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hardware News Pro | Notícias sobre Hardware</title>

<style>
:root{
  --bg:#07111f;
  --bg2:#0b1626;
  --card:#101d30;
  --blue:#00b7ff;
  --blue2:#63d5ff;
  --text:#f5f8fc;
  --muted:#a5b3c5;
  --border:#20334c;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top left,rgba(0,183,255,.12),transparent 28%),
    linear-gradient(145deg,var(--bg),var(--bg2));
  color:var(--text);
}

a{text-decoration:none;color:inherit}

.container{
  width:min(1150px,92%);
  margin:auto;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(7,17,31,.95);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
}

nav{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:20px;
  font-weight:900;
}

.logo span{color:var(--blue)}

.links{
  display:flex;
  gap:24px;
}

.links a{
  color:var(--muted);
  font-size:14px;
}

.links a:hover
