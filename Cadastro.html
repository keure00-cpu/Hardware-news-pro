<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Criar Conta | Hardware News Pro</title>

<style>

:root{
  --bg:#07111f;
  --bg2:#0b1626;
  --card:#101d30;
  --blue:#00b7ff;
  --blue2:#63d5ff;
  --text:#f5f8fc;
  --muted:#a5b3c5;
  --border:#20334c;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top left,rgba(0,183,255,.15),transparent 30%),
    linear-gradient(145deg,var(--bg),var(--bg2));
  color:var(--text);
}

a{
  text-decoration:none;
  color:inherit;
}

header{
  border-bottom:1px solid var(--border);
  background:rgba(7,17,31,.95);
}

nav{
  width:min(1100px,92%);
  height:70px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:20px;
  font-weight:900;
}

.logo span{
  color:var(--blue);
}

.back{
  padding:10px 16px;
  border-radius:10px;
  border:1px solid var(--border);
  color:white;
}

.back:hover{
  border-color:var(--blue);
}

.main{
  min-height:calc(100vh - 70px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 15px;
}

.card{
  width:100%;
  max-width:500px;
  padding:35px;
  border-radius:24px;
  background:rgba(16,29,48,.95);
  border:1px solid var(--border);
  box-shadow:0 20px 70px rgba(0,0,0,.3);
}

.icon{
  width:60px;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  border-radius:18px;
  background:rgba(0,183,255,.12);
  margin-bottom:20px;
}

.badge{
  display:inline-block;
  padding:7px 12px;
  border-radius:20px;
  background:rgba(0,183,255,.1);
  border:1px solid rgba(0,183,255,.25);
  color:var(--blue2);
  font-size:11px;
  font-weight:bold;
}

h1{
  margin:15px 0 10px;
  font-size:32px;
}

.description{
  color:var(--muted);
  line-height:1.6;
}

form{
  margin-top:25px;
}
