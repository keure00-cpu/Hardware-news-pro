<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Criar Conta | Hardware News Pro</title>

<style>

:root{
  --bg:#07111f;
  --bg2:#0b1626;
  --card:#101d30;
  --blue:#00b7ff;
  --blue2:#63d5ff;
  --text:#f5f8fc;
  --muted:#a5b3c5;
  --border:#20334c;
  --danger:#ff5c70;
  --success:#2ee59d;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top right,rgba(0,183,255,.14),transparent 30%),
    linear-gradient(145deg,var(--bg),var(--bg2));
  color:var(--text);
}

a{
  color:inherit;
  text-decoration:none;
}

.container{
  width:min(1150px,92%);
  margin:auto;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(7,17,31,.95);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
}

nav{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:.3px;
}

.logo span{
  color:var(--blue);
}

.nav-links{
  display:flex;
  gap:22px;
}

.nav-links a{
  color:var(--muted);
  font-size:14px;
}

.nav-links a:hover{
  color:var(--blue);
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:46px;
  padding:0 20px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:800;
  transition:.2s;
  background:linear-gradient(135deg,var(--blue2),var(--blue));
  color:#03111c;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-outline{
  background:transparent;
  color:white;
  border:1px solid var(--border);
}

/* CADASTRO */

.signup-section{
  min-height:calc(100vh - 70px);
  display:flex;
  align-items:center;
  padding:55px 0;
}

.signup-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:50px;
  align-items:center;
}

.badge{
  display:inline-block;
  padding:8px 13px;
  border-radius:30px;
  border:1px solid rgba(0,183,255,.35);
  background:rgba(0,183,255,.08);
  color:var(--blue2);
  font-size:11px;
  font-weight:800;
  letter-spacing:.5px;
}

.signup-info h1{
  font-size:clamp(42px,6vw,68px);
  line-height:.98;
  margin:20px 0;
  letter-spacing:-2px;
}
