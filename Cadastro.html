<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro | Hardware News Pro</title>

<style>
:root{
  --bg:#07111f;
  --bg2:#0b1626;
  --card:#101d30;
  --blue:#00b7ff;
  --blue2:#63d5ff;
  --text:#f5f8fc;
  --muted:#a5b3c5;
  --border:#20334c;
  --red:#ff6675;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top left,rgba(0,183,255,.16),transparent 32%),
    linear-gradient(145deg,var(--bg),var(--bg2));
}

a{
  color:inherit;
  text-decoration:none;
}

/* HEADER */

header{
  width:100%;
  background:rgba(7,17,31,.96);
  border-bottom:1px solid var(--border);
}

nav{
  width:min(1100px,92%);
  min-height:72px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:21px;
  font-weight:900;
}

.logo span{
  color:var(--blue);
}

/* BUTTONS */

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:none;
  border-radius:10px;
  padding:13px 18px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
  background:linear-gradient(
    135deg,
    var(--blue2),
    var(--blue)
  );
  color:#03111b;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn:disabled{
  opacity:.65;
  cursor:not-allowed;
  transform:none;
}

.btn-outline{
  background:transparent;
  color:white;
  border:1px solid var(--border);
}

/* MAIN */

main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:45px 20px;
}

.card{
  width:100%;
  max-width:500px;
  padding:36px;
  border-radius:25px;
  background:rgba(16,29,48,.97);
  border:1px solid var(--border);
  box-shadow:0 25px 70px rgba(0,0,0,.35);
}

.badge{
  display:inline-block;
  padding:7px 12px;
  border-radius:30px;
  font-size:11px;
  font-weight:900;
  color:var(--blue2);
  background:rgba(0,183,255,.08);
  border:1px solid rgba(0,183,255,.25);
}

h1{
  margin:18px 0 10px;
  font-size:34px;
}

.description{
  margin:0;
  color:var(--muted);
  line-height:1.6;
}

/* FORM */

form{
  margin-top:25px;
}

label{
  display:block;
  margin:18px 0 8px;
  font-size:14px;
  font-weight:bold;
}

input{
  width:100%;
  padding:15px;
  border-radius:11px;
  border:1px solid var(--border);
  background:#091421;
  color:white;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:var(--blue);
}

.submit{
  width:100%;
  margin-top:24px;
  padding:15px;
}

/* MESSAGE */

.message{
  display:none;
  margin-top:18px;
  padding:13px;
  border-radius:10px;
  font-size:14px;
  line-height:1.5;
}

  display:block;
  color:#ffabb4;
