<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Entrar | Hardware News Pro</title>

<style>
:root{
  --bg:#07111f;
  --bg2:#0b1626;
  --card:#101d30;
  --blue:#00b7ff;
  --blue2:#63d5ff;
  --text:#f5f8fc;
  --muted:#a5b3c5;
  --border:#20334c;
  --red:#ff6675;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top left,rgba(0,183,255,.16),transparent 32%),
    linear-gradient(145deg,var(--bg),var(--bg2));
}

a{
  text-decoration:none;
  color:inherit;
}

header{
  border-bottom:1px solid var(--border);
  background:rgba(7,17,31,.95);
}

nav{
  width:min(1100px,92%);
  min-height:72px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:21px;
  font-weight:900;
}

.logo span{
  color:var(--blue);
}

.btn{
  border:none;
  cursor:pointer;
  padding:13px 19px;
  border-radius:10px;
  font-size:14px;
  font-weight:800;
  transition:.2s;
  background:linear-gradient(135deg,var(--blue2),var(--blue));
  color:#04121d;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-outline{
  background:transparent;
  color:white;
  border:1px solid var(--border);
}

main{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:45px 20px;
}

.card{
  width:min(460px,100%);
  padding:36px;
  border-radius:25px;
  background:rgba(16,29,48,.96);
  border:1px solid var(--border);
  box-shadow:0 25px 70px rgba(0,0,0,.35);
}

.badge{
  display:inline-block;
  padding:7px 12px;
  border-radius:20px;
  color:var(--blue2);
  background:rgba(0,183,255,.08);
  border:1px solid rgba(0,183,255,.25);
  font-size:11px;
  font-weight:900;
}

h1{
  margin:18px 0 10px;
  font-size:34px;
}

.description{
  color:var(--muted);
  line-height:1.6;
}

form{
  margin-top:25px;
}

label{
  display:block;
  margin:18px 0 8px;
  font-size:14px;
  font-weight:bold;
}

input{
  width:100%;
  padding:15px;
  border-radius:11px;
  border:1px solid var(--border);
  background:#091421;
  color:white;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:var(--blue);
}

.submit{
  width:100%;
  margin-top:25px;
  padding:15px;
}

.message{
  display:none;
  margin-top:18px;
  padding:13px;
  border-radius:10px;
  font-size:14px;
  line-height:1.5;
}

.message.error{
  display:block;
  color:#ffabb4;
  background:rgba(255,102,117,.10);
  border:1px solid rgba(255,102,117,.35);
}

.message.success{
  display:block;
  color:var(--blue2);
  background:rgba(0,183,255,.10);
  border:1px solid rgba(0,183,255,.35);
}

.bottom{
  margin-top:25px;
  text-align:center;
}

.bottom p{
  color:var(--muted);
}

.bottom a{
  color:var(--blue2);
  font-weight:bold;
}

footer{
  padding:25px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

@media(max-width:500px){

  .card{
    padding:25px;
  }

  h1{
    font-size:28px;
  }

}
</style>
</head>

<body>

<header>

<nav>

<a href="index.html" class="logo">
HARDWARE <span>NEWS PRO</span>
</a>

<a href="index.html" class="btn btn-outline">
← Início
</a>

</nav>

</header>


<main>

<div class="card">

<span class="badge">
ÁREA DO USUÁRIO
</span>

<h1>
Entrar na conta
</h1>

<p class="description">
Digite o e-mail e a senha utilizados no seu cadastro.
</p>


<form id="loginForm">

<label for="email">
E-mail
</label>

<input
type="email"
id="email"
placeholder="Digite seu e-mail"
autocomplete="email"
required
>


<label for="senha">
Senha
</label>

<input
type="password"
id="senha"
placeholder="Digite sua senha"
autocomplete="current-password"
required
>


<div
id="message"
class="message">
</div>


<button
type="submit"
class="btn submit"
id="loginButton">

🔐 Entrar

</button>

</form>


<div class="bottom">

<p>
Ainda não possui uma conta?
</p>

<a href="cadastro.html">
Criar minha conta →
</a>

</div>

</div>

</main>


<footer>
© 2026 Hardware News Pro
</footer>


<script>

const STORAGE_USERS = "hardwareNewsUsuarios";
const STORAGE_LOGGED = "hardwareNewsUsuarioLogado";


function mostrarMensagem(texto,tipo){

  const box =
    document.getElementById("message");

  box.textContent = texto;
  box.className = "message " + tipo;

}


function obterUsuarios(){

  try{

    const dados =
      localStorage.getItem(STORAGE_USERS);

    if(!dados){
      return [];
    }

    const usuarios =
      JSON.parse(dados);

    return Array.isArray(usuarios)
      ? usuarios
      : [];

  }catch(error){

    return [];

  }

}


document
.getElementById("loginForm")
.addEventListener("submit",function(event){

  event.preventDefault();


  const email =
    document
    .getElementById("email")
    .value
    .trim()
    .toLowerCase();


  const senha =
    document
    .getElementById("senha")
    .value;


  if(!email || !senha){

    mostrarMensagem(
      "Preencha todos os campos.",
      "error"
    );

    return;

  }


  const usuarios =
    obterUsuarios();


  if(usuarios.length === 0){

    mostrarMensagem(
      "Nenhuma conta encontrada. Crie uma conta primeiro.",
      "error"
    );

    return;

  }


  const usuario =
    usuarios.find(function(item){

      return String(item.email || "")
        .trim()
        .toLowerCase() === email;

    });


  if(!usuario){

    mostrarMensagem(
      "Este e-mail não está cadastrado.",
      "error"
    );

    return;

  }


  const senhaSalva =
    String(
      usuario.senha ||
      usuario.password ||
      ""
    );


  if(senha !== senhaSalva){

    mostrarMensagem(
      "Senha incorreta.",
      "error"
    );

    return;

  }


  const usuarioLogado = {

    id:
      usuario.id ||
      "user_" + Date.now(),

    nome:
      usuario.nome ||
      "Usuário",

    email:
      usuario.email,

    premium:
      usuario.premium === true,

    plano:
      usuario.plano ||
      (
        usuario.premium === true
          ? "Premium"
          : "Gratuito"
      )

  };


  localStorage.setItem(
    STORAGE_LOGGED,
    JSON.stringify(usuarioLogado)
  );


  mostrarMensagem(
    "Login realizado com sucesso! Redirecionando...",
    "success"
  );


  document
  .getElementById("loginButton")
  .disabled = true;


  setTimeout(function(){

    window.location.href =
      "index.html";

  },800);

});

</script>

</body>
</html>
