<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin | Hardware News Pro</title>

<style>
:root{
  --bg:#07111f;
  --bg2:#0b1626;
  --card:#101d30;
  --blue:#00b7ff;
  --blue2:#63d5ff;
  --text:#f5f8fc;
  --muted:#a5b3c5;
  --border:#20334c;
  --green:#25D366;
  --red:#ff5d6c;
  --yellow:#ffc857;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top left,rgba(0,183,255,.15),transparent 30%),
    linear-gradient(145deg,var(--bg),var(--bg2));
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* LOGIN */

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:430px;
  padding:35px;
  border-radius:24px;
  background:rgba(16,29,48,.98);
  border:1px solid var(--border);
  box-shadow:0 25px 80px rgba(0,0,0,.4);
}

.login-icon{
  width:65px;
  height:65px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:18px;
  font-size:30px;
  background:rgba(0,183,255,.1);
}

.logo{
  font-weight:900;
  font-size:20px;
}

.logo span{
  color:var(--blue);
}

.login-box h1{
  margin:25px 0 10px;
  font-size:30px;
}

.login-box p{
  color:var(--muted);
  line-height:1.6;
}

.login-box form{
  margin-top:25px;
}

/* ADMIN */

#adminApp{
  display:none;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  border-bottom:1px solid var(--border);
  background:rgba(7,17,31,.97);
  backdrop-filter:blur(12px);
}

.nav{
  width:min(1250px,94%);
  min-height:72px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.nav-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.admin-name{
  color:var(--blue2);
  font-size:14px;
  font-weight:bold;
}

/* LAYOUT */

.container{
  width:min(1250px,94%);
  margin:auto;
}

.dashboard{
  padding:45px 0;
}

.page-title{
  margin-bottom:30px;
}

.page-title h1{
  margin:0 0 10px;
  font-size:36px;
}

.page-title p{
  margin:0;
  color:var(--muted);
}

/* BUTTONS */

.btn{
  border:none;
  padding:13px 18px;
  border-radius:10px;
  font-weight:800;
  background:linear-gradient(135deg,var(--blue2),var(--blue));
  color:#03111c;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-outline{
  background:transparent;
  color:var(--text);
  border:1px solid var(--border);
}

.btn-green{
  background:var(--green);
  color:white;
}

.btn-red{
  background:var(--red);
  color:white;
}

.btn-small{
  padding:9px 12px;
  font-size:12px;
}
